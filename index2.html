<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
    <title>Velvet · Тех. перерыв</title>
    <meta name="theme-color" content="#07051f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #07051f;
            --ln: rgba(255,255,255,.1);
            --t: #f5f2ff;
            --m: #9b93cf;
            --g: #c19bff;
            --bad: #ff5470;
            --hd: 'Unbounded', system-ui, sans-serif;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html {
            background: var(--bg);
            color-scheme: dark;
            height: 100%;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--t);
            font: 500 15px/1.4 Manrope, system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* Тот же фон, что и в основном приложении */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(70% 38% at 90% -6%, rgba(139,61,255,.5), transparent 70%),
                radial-gradient(55% 32% at -5% 58%, rgba(214,70,255,.2), transparent 70%),
                radial-gradient(70% 40% at 100% 100%, rgba(60,90,255,.25), transparent 70%);
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            animation: fadeUp 0.6s ease-out;
        }

        /* Логотип сверху */
        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .lg {
            font: 700 18px var(--hd);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7b2ff7, #c04dff);
            display: grid;
            place-items: center;
            color: #fff;
            box-shadow: 0 4px 16px rgba(139,61,255,.55), inset 0 1px 0 rgba(255,255,255,.4);
        }

        .logo-wrap h1 {
            font: 700 22px var(--hd);
            margin: 0;
            letter-spacing: .02em;
        }

        /* Главная карточка */
        .card {
            background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.03));
            border: 1px solid var(--ln);
            border-radius: 28px;
            padding: 35px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);
            position: relative;
            overflow: hidden;
        }

        /* Иконка с пульсацией */
        .icon-wrap {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(255, 84, 112, 0.1);
            display: grid;
            place-items: center;
            position: relative;
            border: 1px solid rgba(255, 84, 112, 0.3);
            box-shadow: 0 0 30px rgba(255, 84, 112, 0.2);
        }

        .icon-wrap::before {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px solid rgba(255, 84, 112, 0.2);
            animation: pulseBorder 2s infinite;
        }

        .icon-wrap svg {
            width: 45px;
            height: 45px;
            fill: var(--bad);
            animation: spinGear 4s linear infinite;
        }

        h2 {
            font: 700 22px/1.3 var(--hd);
            margin: 0 0 12px;
            color: #fff;
        }

        p {
            color: var(--m);
            font-size: 14px;
            margin: 0 0 25px;
            line-height: 1.5;
        }

        /* Кнопка */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 52px;
            padding: 14px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 15px;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #7b2ff7, #b84dff);
            box-shadow: 0 10px 26px rgba(123,47,247,.5), inset 0 1px 0 rgba(255,255,255,.35);
            transition: transform 0.12s ease, filter 0.12s;
            border: none;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
            filter: brightness(1.1);
        }

        .btn svg {
            margin-right: 8px;
            width: 20px;
            height: 20px;
        }

        /* Таймер */
        .timer {
            display: inline-block;
            margin-top: 25px;
            font-family: monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--bad);
            background: rgba(255, 84, 112, 0.1);
            padding: 6px 16px;
            border-radius: 12px;
            letter-spacing: 0.05em;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spinGear {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseBorder {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Логотип Velvet -->
        <div class="logo-wrap">
            <i class="lg">V</i>
            <h1>Velvet</h1>
        </div>

        <!-- Основная карточка -->
        <div class="card">
            <div class="icon-wrap">
                <!-- Иконка шестеренки (можно заменить на любую) -->
                <svg viewBox="0 0 24 24">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                </svg>
            </div>

            <h2>Технический перерыв</h2>
            <p>Мы обновляем серверы, чтобы игра стала ещё быстрее и стабильнее. Пожалуйста, зайдите чуть позже.</p>

            <!-- Кнопка на канал (чтобы не терять игроков) -->
            <a href="https://t.me/velvetcas" target="_blank" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 4L2 12l7 3 3 7 4-6 6-12z" fill="currentColor"/>
                </svg>
                Наш канал с новостями
            </a>
            
            <!-- (Необязательно) Таймер обратного отсчета -->
            <div class="timer" id="timer">00:15:00</div>
        </div>
    </div>

    <script>
        // Простой таймер обратного отсчета (15 минут) для видимости
        let time = 15 * 60; 
        const timerEl = document.getElementById('timer');
        
        setInterval(() => {
            if (time <= 0) return;
            time--;
            const h = Math.floor(time / 3600);
            const m = Math.floor((time % 3600) / 60);
            const s = time % 60;
            timerEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
